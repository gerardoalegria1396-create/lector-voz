<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lector de Voz MP3</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0f172a">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-between p-4 selection:bg-sky-500 selection:text-white">

  <!-- Encabezado -->
  <header class="w-full max-w-md pt-4 pb-2 flex items-center justify-between border-b border-slate-800">
    <div>
      <h1 class="text-xl font-bold bg-gradient-to-r from-sky-400 to-indigo-400 bg-clip-text text-transparent">Lector de Voz MP3</h1>
      <p class="text-xs text-slate-400">Conversor directo sin API Key</p>
    </div>
    <span class="px-2.5 py-1 bg-emerald-500/10 text-emerald-400 text-xs rounded-full border border-emerald-500/20 font-medium">100% Gratis</span>
  </header>

  <!-- Contenedor Principal -->
  <main class="w-full max-w-md flex flex-col gap-4 my-auto">
    
    <!-- Selector de Región / Acento -->
    <div class="bg-slate-800/60 rounded-xl p-3 border border-slate-700/60 flex flex-col gap-2">
      <label for="voiceSelect" class="text-xs font-semibold text-slate-300">Selecciona el acento:</label>
      <select id="voiceSelect" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-slate-200 focus:outline-none focus:border-sky-500">
        <option value="es-us">Español Neutro / Latino</option>
        <option value="es-es">Español España</option>
      </select>
    </div>

    <!-- Entrada de Texto -->
    <div class="relative">
      <textarea id="textInput" rows="7" placeholder="Escribe o pega aquí el texto que quieres escuchar y descargar..." 
        class="w-full p-4 bg-slate-800/80 border border-slate-700 rounded-2xl text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-sky-500 text-sm leading-relaxed resize-none shadow-inner"></textarea>
      <div class="absolute bottom-3 right-4 text-[11px] text-slate-400 font-mono" id="charCount">0 caracteres</div>
    </div>

    <!-- Botón de Síntesis -->
    <button id="generateBtn" class="w-full py-3.5 bg-gradient-to-r from-sky-500 to-indigo-600 hover:from-sky-400 hover:to-indigo-500 active:scale-[0.98] transition-all text-white font-medium rounded-xl shadow-lg shadow-sky-500/20 flex items-center justify-center gap-2">
      <svg id="btnIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" />
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
      <span id="btnText">Generar y Reproducir Audio</span>
    </button>

    <!-- Reproductor y Descarga -->
    <div id="playerSection" class="hidden bg-slate-800/80 border border-slate-700 rounded-2xl p-4 flex flex-col gap-3 shadow-md">
      <div class="flex items-center justify-between text-xs text-slate-400 font-medium">
        <span>Audio generado</span>
        <span class="text-emerald-400 font-mono">● MP3</span>
      </div>
      <audio id="audioPlayer" controls class="w-full rounded-lg bg-slate-900"></audio>
      
      <a id="downloadBtn" download="voz_audio.mp3" target="_blank" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-center text-sm font-medium flex items-center justify-center gap-2 active:scale-[0.98] transition-all shadow-md">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
        </svg>
        Descargar MP3
      </a>
    </div>

  </main>

  <footer class="text-center py-2 text-xs text-slate-500">
    Compatible con Android y Chrome.
  </footer>

  <!-- LÓGICA SIN ERRORES DE CORS -->
  <script>
    const textInput = document.getElementById('textInput');
    const charCount = document.getElementById('charCount');
    const generateBtn = document.getElementById('generateBtn');
    const btnText = document.getElementById('btnText');
    const btnIcon = document.getElementById('btnIcon');
    const playerSection = document.getElementById('playerSection');
    const audioPlayer = document.getElementById('audioPlayer');
    const downloadBtn = document.getElementById('downloadBtn');
    const voiceSelect = document.getElementById('voiceSelect');

    textInput.addEventListener('input', () => {
      charCount.textContent = `${textInput.value.length} caracteres`;
    });

    generateBtn.addEventListener('click', () => {
      const text = textInput.value.trim();
      const lang = voiceSelect.value;

      if (!text) {
        alert('Por favor ingresa un texto para procesar.');
        return;
      }

      // Generar URL directa de audio (Google TTS endpoint)
      // Al asignarse directamente al elemento <audio>, no se dispara la restricción CORS de fetch()
      const ttsUrl = `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodeURIComponent(text)}&tl=${lang}&client=tw-ob`;

      // Configurar reproductor
      audioPlayer.src = ttsUrl;
      downloadBtn.href = ttsUrl;
      downloadBtn.download = `audio_${Date.now()}.mp3`;

      playerSection.classList.remove('hidden');
      
      // Reproducir
      audioPlayer.play().catch(() => {
        // En algunos teléfonos Android requiere que el usuario presione play manualmente
        console.log("Presiona play en el reproductor");
      });
    });
  </script>
</body>
</html>
