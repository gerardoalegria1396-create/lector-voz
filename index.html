<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lector de Textos Extensos (50k)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0f172a">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-between p-4 selection:bg-sky-500 selection:text-white">

  <!-- Header -->
  <header class="w-full max-w-lg pt-4 pb-2 flex items-center justify-between border-b border-slate-800">
    <div>
      <h1 class="text-xl font-bold bg-gradient-to-r from-sky-400 to-indigo-400 bg-clip-text text-transparent">Lector de Textos Extensos</h1>
      <p class="text-xs text-slate-400">Soporte para novelas, ensayos y documentos largos</p>
    </div>
    <span class="px-2.5 py-1 bg-sky-500/10 text-sky-400 text-xs rounded-full border border-sky-500/20 font-mono">Modo Batch</span>
  </header>

  <!-- Contenedor Principal -->
  <main class="w-full max-w-lg flex flex-col gap-4 my-auto">
    
    <!-- Configuración de Voz -->
    <div class="bg-slate-800/60 rounded-xl p-3 border border-slate-700/60 flex items-center justify-between gap-2">
      <label for="voiceSelect" class="text-xs font-semibold text-slate-300">Acento:</label>
      <select id="voiceSelect" class="bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-slate-200 focus:outline-none focus:border-sky-500">
        <option value="es-us">Español Latinoamericano</option>
        <option value="es-es">Español de España</option>
      </select>
    </div>

    <!-- Área de Texto -->
    <div class="relative">
      <textarea id="textInput" rows="9" placeholder="Pega aquí tu texto completo (capítulos enteros, 50k caracteres o más)..." 
        class="w-full p-4 bg-slate-800/80 border border-slate-700 rounded-2xl text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-sky-500 text-sm leading-relaxed resize-none shadow-inner"></textarea>
      <div class="absolute bottom-3 right-4 text-[11px] text-slate-400 font-mono" id="charCount">0 caracteres</div>
    </div>

    <!-- Botón de Generación -->
    <button id="generateBtn" class="w-full py-3.5 bg-gradient-to-r from-sky-500 to-indigo-600 hover:from-sky-400 hover:to-indigo-500 active:scale-[0.98] transition-all text-white font-medium rounded-xl shadow-lg shadow-sky-500/20 flex items-center justify-center gap-2">
      <svg id="btnIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" />
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
      <span id="btnText">Procesar y Compilar Audio Completo</span>
    </button>

    <!-- Indicador de Progreso Detallado -->
    <div id="progressContainer" class="hidden bg-slate-800/90 border border-slate-700 rounded-2xl p-4 flex flex-col gap-2 shadow-md">
      <div class="flex justify-between items-center text-xs">
        <span id="progressStatus" class="text-sky-400 font-medium">Dividiendo texto en fragmentos...</span>
        <span id="progressPercent" class="text-slate-400 font-mono">0%</span>
      </div>
      <div class="w-full bg-slate-900 rounded-full h-2.5 overflow-hidden p-0.5 border border-slate-700">
        <div id="progressBar" class="bg-gradient-to-r from-sky-500 to-emerald-400 h-full rounded-full transition-all duration-200" style="width: 0%"></div>
      </div>
      <div class="flex justify-between items-center text-[10px] text-slate-500 font-mono">
        <span id="chunkIndicator">Fragmento: 0 / 0</span>
        <span id="timeIndicator">Mantén la pestaña abierta</span>
      </div>
    </div>

    <!-- Error Box -->
    <div id="errorBox" class="hidden bg-rose-500/10 border border-rose-500/30 text-rose-300 p-3 rounded-xl text-xs flex items-center gap-2">
      <span id="errorMessage"></span>
    </div>

    <!-- Reproductor y Descarga -->
    <div id="playerSection" class="hidden bg-slate-800/80 border border-slate-700 rounded-2xl p-4 flex flex-col gap-3 shadow-md">
      <div class="flex items-center justify-between text-xs text-slate-400 font-medium">
        <span>Audio ensamblado con éxito</span>
        <span class="text-emerald-400 font-mono" id="durationBadge">● Completo</span>
      </div>
      <audio id="audioPlayer" controls class="w-full rounded-lg bg-slate-900"></audio>
      
      <a id="downloadBtn" download="audio_completo.wav" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-center text-sm font-medium flex items-center justify-center gap-2 active:scale-[0.98] transition-all shadow-md">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
        </svg>
        Descargar Audio Completo
      </a>
    </div>

  </main>

  <footer class="text-center py-2 text-xs text-slate-500">
    Procesamiento local en memoria mediante Web Audio API.
  </footer>

  <script>
    const textInput = document.getElementById('textInput');
    const charCount = document.getElementById('charCount');
    const generateBtn = document.getElementById('generateBtn');
    const btnText = document.getElementById('btnText');
    const btnIcon = document.getElementById('btnIcon');
    const progressContainer = document.getElementById('progressContainer');
    const progressBar = document.getElementById('progressBar');
    const progressStatus = document.getElementById('progressStatus');
    const progressPercent = document.getElementById('progressPercent');
    const chunkIndicator = document.getElementById('chunkIndicator');
    const playerSection = document.getElementById('playerSection');
    const audioPlayer = document.getElementById('audioPlayer');
    const downloadBtn = document.getElementById('downloadBtn');
    const voiceSelect = document.getElementById('voiceSelect');
    const errorBox = document.getElementById('errorBox');
    const errorMessage = document.getElementById('errorMessage');

    textInput.addEventListener('input', () => {
      charCount.textContent = `${textInput.value.length.toLocaleString()} caracteres`;
    });

    // Función para fragmentar textos de 50k sin cortar palabras
    function splitTextIntoChunks(text, maxLength = 180) {
      const sentences = text.match(/[^.!?\n]+[.!?\n]+/g) || [text];
      const chunks = [];
      let currentChunk = "";

      for (const sentence of sentences) {
        if ((currentChunk + sentence).length <= maxLength) {
          currentChunk += sentence;
        } else {
          if (currentChunk.trim()) chunks.push(currentChunk.trim());
          if (sentence.length > maxLength) {
            // Si una sola oración es larguísima, dividir por comas o palabras
            const words = sentence.split(" ");
            let subChunk = "";
            for (const word of words) {
              if ((subChunk + " " + word).length <= maxLength) {
                subChunk += (subChunk ? " " : "") + word;
              } else {
                if (subChunk.trim()) chunks.push(subChunk.trim());
                subChunk = word;
              }
            }
            if (subChunk.trim()) currentChunk = subChunk;
          } else {
            currentChunk = sentence;
          }
        }
      }
      if (currentChunk.trim()) chunks.push(currentChunk.trim());
      return chunks;
    }

    // Convertidor a WAV estándar descargable compatible con Android y reproductores nativos
    function audioBufferToWav(buffer) {
      let numOfChan = buffer.numberOfChannels,
          length = buffer.length * numOfChan * 2 + 44,
          out = new DataView(new ArrayBuffer(length)),
          channels = [], i, sample,
          offset = 0,
          pos = 0;

      function setUint16(data) { out.setUint16(pos, data, true); pos += 2; }
      function setUint32(data) { out.setUint32(pos, data, true); pos += 4; }

      setUint32(0x46464952); // "RIFF"
      setUint32(length - 8); 
      setUint32(0x45564157); // "WAVE"
      setUint32(0x20746d66); // "fmt "
      setUint32(16);         // tamaño subchunk
      setUint16(1);          // PCM
      setUint16(numOfChan);
      setUint32(buffer.sampleRate);
      setUint32(buffer.sampleRate * 2 * numOfChan);
      setUint16(numOfChan * 2);
      setUint16(16);         // 16 bits por muestra
      setUint32(0x61746164); // "data"
      setUint32(length - pos - 4);

      for (i = 0; i < buffer.numberOfChannels; i++) channels.push(buffer.getChannelData(i));

      while (offset < buffer.length) {
        for (i = 0; i < numOfChan; i++) {
          sample = Math.max(-1, Math.min(1, channels[i][offset]));
          sample = (0.5 + sample < 0 ? sample * 32768 : sample * 32767) | 0;
          out.setInt16(pos, sample, true);
          pos += 2;
        }
        offset++;
      }
      return new Blob([out], { type: 'audio/wav' });
    }

    generateBtn.addEventListener('click', async () => {
      const text = textInput.value.trim();
      const lang = voiceSelect.value;
      errorBox.classList.add('hidden');

      if (!text) {
        alert('Ingresa el texto a procesar.');
        return;
      }

      const chunks = splitTextIntoChunks(text);
      if (chunks.length === 0) return;

      generateBtn.disabled = true;
      btnText.textContent = 'Compilando audio...';
      btnIcon.classList.add('animate-spin');
      progressContainer.classList.remove('hidden');
      playerSection.classList.add('hidden');

      const audioContext = new (window.AudioContext || window.webkitAudioContext)();
      const audioBuffers = [];

      try {
        for (let i = 0; i < chunks.length; i++) {
          const chunk = chunks[i];
          const percent = Math.round(((i + 1) / chunks.length) * 100);
          
          progressBar.style.width = `${percent}%`;
          progressPercent.textContent = `${percent}%`;
          chunkIndicator.textContent = `Fragmento: ${i + 1} / ${chunks.length}`;
          progressStatus.textContent = `Descargando fragmento ${i + 1}...`;

          // URL directa del segmento
          const url = `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodeURIComponent(chunk)}&tl=${lang}&client=tw-ob`;

          const response = await fetch(url);
          if (!response.ok) throw new Error(`Fallo en el fragmento ${i + 1}`);

          const arrayBuffer = await response.arrayBuffer();
          const decodedData = await audioContext.decodeAudioData(arrayBuffer);
          audioBuffers.push(decodedData);

          // Pausa corta de 150ms entre llamadas para evitar bloqueos por tasa de peticiones
          await new Promise(r => setTimeout(r, 150));
        }

        progressStatus.textContent = 'Concatenando audio completo...';

        // Unir todos los buffers de audio en un solo canal continuo
        const totalLength = audioBuffers.reduce((acc, b) => acc + b.length, 0);
        const mergedBuffer = audioContext.createBuffer(
          1, // Mono para voz
          totalLength,
          audioBuffers[0].sampleRate
        );

        let offset = 0;
        const channelData = mergedBuffer.getChannelData(0);
        for (const b of audioBuffers) {
          channelData.set(b.getChannelData(0), offset);
          offset += b.length;
        }

        // Convertir a archivo descargable
        const finalBlob = audioBufferToWav(mergedBuffer);
        const finalUrl = URL.createObjectURL(finalBlob);

        audioPlayer.src = finalUrl;
        downloadBtn.href = finalUrl;
        downloadBtn.download = `audio_completo_${Date.now()}.wav`;

        progressContainer.classList.add('hidden');
        playerSection.classList.remove('hidden');
        audioPlayer.play().catch(() => {});

      } catch (err) {
        errorBox.classList.remove('hidden');
        errorMessage.textContent = `Error al procesar: ${err.message}. Intenta con un fragmento más moderado.`;
        progressContainer.classList.add('hidden');
      } finally {
        generateBtn.disabled = false;
        btnText.textContent = 'Procesar y Compilar Audio Completo';
        btnIcon.classList.remove('animate-spin');
      }
    });
  </script>
</body>
</html>
